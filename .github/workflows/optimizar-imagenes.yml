name: Optimizar imágenes de eventos

# Cuando Javier sube una foto o un video desde /admin, se reduce solo (fotos: máx. 1200 px, calidad 82, sin datos de ubicación; videos pesados: se recomprimen)
# para que la página siga rápida en el celular. Si ya está optimizada, no hace nada.
on:
  push:
    branches: [main]
    paths:
      - 'assets/eventos/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reducir imágenes pesadas
        run: |
          cambios=0
          shopt -s nullglob nocaseglob
          for f in assets/eventos/*.jpg assets/eventos/*.jpeg assets/eventos/*.png; do
            ancho=$(identify -format '%w' "$f[0]")
            alto=$(identify -format '%h' "$f[0]")
            peso=$(stat -c%s "$f")
            if [ "$ancho" -gt 1200 ] || [ "$alto" -gt 1200 ] || [ "$peso" -gt 450000 ]; then
              mogrify -auto-orient -strip -resize '1200x1200>' -quality 82 "$f"
              echo "Optimizada: $f ($peso bytes -> $(stat -c%s "$f"))"
              cambios=1
            fi
          done
          # Videos: si pesan más de 12 MB o son más grandes que 1280 px, se recomprimen (H.264, listo para celular)
          for f in assets/eventos/*.mp4 assets/eventos/*.m4v; do
            peso=$(stat -c%s "$f")
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f")
            ancho=${dims%,*}; alto=${dims#*,}
            if [ "$peso" -gt 12000000 ] || [ "$ancho" -gt 1280 ] || [ "$alto" -gt 1280 ]; then
              ffmpeg -y -loglevel error -i "$f" -vf "scale='if(gt(iw,ih),min(1280,iw),-2)':'if(gt(iw,ih),-2,min(1280,ih))'" -c:v libx264 -crf 28 -preset veryfast -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$f.tmp.mp4" && mv "$f.tmp.mp4" "$f"
              echo "Video optimizado: $f ($peso bytes -> $(stat -c%s "$f"))"
              cambios=1
            fi
          done
          echo "CAMBIOS=$cambios" >> "$GITHUB_ENV"

      - name: Guardar y volver a publicar
        if: env.CAMBIOS == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eventos
          git commit -m "eventos: optimizar imágenes subidas"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
